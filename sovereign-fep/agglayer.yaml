services:
  database:
    image: postgres:16.2
    container_name: agglayer-database
    network_mode: host
    volumes:
      - ./agglayer-data:/var/lib/postgresql
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      - POSTGRES_DB=master
      - POSTGRES_USER=master_user
      - POSTGRES_PASSWORD=master_password