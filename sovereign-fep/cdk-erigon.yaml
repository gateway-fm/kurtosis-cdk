services:
  # Anvil - Foundry's local Ethereum node with latest EIPs
  erigon-sequencer:
    image: cdk-erigon:local
    container_name: erigon-sequencer
    network_mode: host
    volumes:
      - ./erigon-config:/etc/cdk-erigon
      - ./data:/data
    command: |
      --config /etc/cdk-erigon/dynamic-network-config.yaml
    environment:
      - CDK_ERIGON_SEQUENCER=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8123", "-X", "POST", "-H", "Content-Type: application/json", "-d", '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}']
      interval: 10s
      timeout: 5s
      retries: 3
